<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="የንባብ መዝገብ · سِجل القراء">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b7d6f"/>
      <stop offset=".55" stop-color="#0f4c43"/>
      <stop offset="1" stop-color="#0b3831"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0dd9e"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f3ead4"/>
    </linearGradient>
  </defs>

  <!-- الخلفية: أخضر المخطوطة العميق -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- وهج نور خفيف أعلى الأيقونة -->
  <ellipse cx="256" cy="130" rx="270" ry="190" fill="#ffffff" opacity="0.05"/>

  <!-- الإطار الدائري المُذهَّب المزدوج -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="#c9a227" stroke-opacity=".55" stroke-width="5"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#c9a227" stroke-opacity=".25" stroke-width="2"/>

  <!-- نقاط زخرفية على الجهات الأربع -->
  <g fill="#e6cf8a">
    <circle cx="256" cy="74"  r="7"/>
    <circle cx="256" cy="438" r="7"/>
    <circle cx="74"  cy="256" r="7"/>
    <circle cx="438" cy="256" r="7"/>
  </g>

  <!-- النجمة الثمانية (الخاتم السليماني) -->
  <g stroke="url(#gold)" stroke-width="10" fill="#c9a227" fill-opacity=".14" stroke-linejoin="round">
    <rect x="210" y="110" width="92" height="92"/>
    <rect x="210" y="110" width="92" height="92" transform="rotate(45 256 156)"/>
  </g>
  <circle cx="256" cy="156" r="16" fill="url(#gold)"/>

  <!-- ظل الكتاب -->
  <ellipse cx="256" cy="406" rx="150" ry="18" fill="#0b3831" opacity=".3"/>

  <!-- الكتاب المفتوح بصفحتيه -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- الصفحة اليسرى -->
    <path d="M256 258 C 208 230 148 230 112 252 L 112 394 C 148 372 208 372 256 402 Z"
          fill="url(#paper)" stroke="#c9a227" stroke-width="5" stroke-opacity=".85"/>
    <!-- الصفحة اليمنى -->
    <path d="M256 258 C 304 230 364 230 400 252 L 400 394 C 364 372 304 372 256 402 Z"
          fill="url(#paper)" stroke="#c9a227" stroke-width="5" stroke-opacity=".85"/>
    <!-- كعب الكتاب -->
    <path d="M256 258 L 256 402" stroke="#c9a227" stroke-width="7"/>
    <!-- سطور الكتابة -->
    <g stroke="#0f4c43" stroke-opacity=".38" stroke-width="6" fill="none">
      <path d="M138 286 C 168 274 204 274 234 286"/>
      <path d="M138 316 C 168 304 204 304 234 316"/>
      <path d="M138 346 C 168 334 204 334 234 346"/>
      <path d="M374 286 C 344 274 308 274 278 286"/>
      <path d="M374 316 C 344 304 308 304 278 316"/>
      <path d="M374 346 C 344 334 308 334 278 346"/>
    </g>
  </g>
</svg>
